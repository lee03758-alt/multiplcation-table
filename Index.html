<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multiplication Table</title>
<link rel="stylesheet" type="text/css" href="stylesheet.css">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>

<section class="container">
    <h1>Multiplication Table Project &#128514;</h1>
    <h2>Multiplication Table Generator! &#128523</h2>

    <div class="generate-box">
    <div class="inputs">
    <label for="rows" class="rows">Rows:

   </label>

    <label for="cols">Columns:
    <input id="cols" type="number" value="10" placeholder="How many cols?"/>
    </label>

<!--   <label for="highlight">Highlight:-->

<!--    </label>-->
    </div>

    <button id="generate" class='myBtn' onclick="createWithFlexbox(getRowsDesired(), getColumnsDesired())">Generate TABLE!</button>
    </div>

    <div id="output"></div>
</section>

</body>
<script src="javascript.js"></script>
</html>
